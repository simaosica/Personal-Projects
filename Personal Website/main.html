<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website - Simão Costa</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="profile text-center">
                    <img src="img/sica.JPG" alt="Profile Photo" class="img">
                    <h1>Simão Costa</h1>
                </div>

                <nav class="nav flex-column text-center">
                    <div class="menu-container">
                        <a data-target="home-content" class="buttons"><h3>Home</h3></a>
                        <a data-target="about-content" class="buttons"><h3>About</h3></a>
                        <a data-target="skills-content" class="buttons"><h3>Skills</h3></a>
                        <a data-target="education-content" class="buttons"><h3>Education</h3></a>
                        <a data-target="experience-content" class="buttons"><h3>Experience</h3></a>
                    </div>

                    <!-- Contacts - icons-->
                    <div class="icon-container">
                        <a class="icon-link" href="https://www.linkedin.com/in/sim%C3%A3o-costa-97960424a/" target="_blank">
                            <img src="img/linkedin.png" alt="LinkedIn" class="icons">
                        </a>
                        <a class="icon-link" href="https://www.instagram.com/simaosica" target="_blank">
                            <img src="img/insta.jpg" alt="Instagram" class="icons">
                        </a>
                    </div>
                </nav>
            </div>

            <!-- Main content area -->
            <div class="main-content">
                <div id="home-content" class="content-section">
                    <h2>Home</h2>
                    <p>Welcome to my website!</p>
                </div>
                <div id="about-content" class="content-section">
                    <h2>About</h2>
                    <p>Learn more about me here.</p>
                </div>
                <div id="skills-content" class="content-section">
                    <h2>Skills</h2>
                    <p>Here are my skills.</p>
                </div>
                <div id="education-content" class="content-section">
                    <h2>Education</h2>
                    <p>My educational background.</p>
                </div>
                <div id="experience-content" class="content-section">
                    <h2>Experience</h2>
                    <p>My work experience.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
